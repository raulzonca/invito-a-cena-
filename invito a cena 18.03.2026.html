<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Invito per Tatina ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      background: url('sfondo.jpg') no-repeat center center/cover;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }

    .container {
      position: relative;
      max-width: 600px;
      padding: 40px;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      color: white;
      z-index: 1;
      animation: fadeIn 2s ease;
    }

    h1 { font-size: 2.5em; }
    p { font-size: 1.2em; line-height: 1.6; }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 80px;
    }

    button {
      padding: 15px 25px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      left: 20%;
      background: #e63946;
      color: white;
    }

    #no {
      left: 60%;
      background: #555;
      color: white;
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: explode 1s ease-out forwards;
    }

    @keyframes explode {
      0% {
        opacity: 1;
        transform: translate(0,0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(2);
      }
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);} 
      to {opacity: 1; transform: translateY(0);} 
    }
  </style>
</head>

<body>

<div class="overlay"></div>

<div class="container" id="main">
  <h1>Tatina ❤️</h1>

  <p>
    Ho pensato a qualcosa di speciale per noi...<br><br>
    Una serata solo nostra,<br>
    tra buon cibo, sorrisi e momenti indimenticabili ✨
  </p>

  <p>
    Ti va di venire a cena con me<br>
    <strong>il 18.03.2026 alle 19:15</strong><br>
    al QB di Bellinzona?
  </p>

  <div class="buttons">
    <button id="yes" onclick="accetta()">SÌ 💕</button>
    <button id="no" onmouseover="scappa()">NO 😜</button>
  </div>
</div>

<script>
  function accetta() {
    esplodiCuori();

    setTimeout(() => {
      document.body.innerHTML = `
        <div style="
          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          background:black;
          color:white;
          font-family:Georgia;
          text-align:center;
        ">
          <div>
            <h1>Non vedo l'ora ❤️</h1>
            <p>Sarà una serata perfetta ✨</p>
          </div>
        </div>
      `;
    }, 1200);
  }

  function esplodiCuori() {
    for (let i = 0; i < 50; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";

      let x = (Math.random() - 0.5) * 600 + "px";
      let y = (Math.random() - 0.5) * 600 + "px";

      heart.style.setProperty("--x", x);
      heart.style.setProperty("--y", y);

      heart.style.left = "50%";
      heart.style.top = "50%";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1000);
    }
  }

  function scappa() {
    let btn = document.getElementById("no");
    let x = Math.random() * 200 - 100;
    let y = Math.random() * 200 - 100;
    btn.style.transform = `translate(${x}px, ${y}px)`;
  }
</script>

</body>
</html>
